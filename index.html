<style>
  :root{
    --bg:#fdf6ee;
    --card:#ffffff;
    --ink:#2c2420;
    --ink-soft:#7a6f66;
    --accent:#e07a3f;
    --accent-soft:#f7e2d1;
    --good:#5a8f6b;
    --good-soft:#e3efe6;
    --warn:#c85c3c;
    --line:#efe3d6;
    --shadow: 0 2px 10px rgba(60,40,20,0.06);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1713;
      --card:#252019;
      --ink:#f2e9e0;
      --ink-soft:#b8ab9e;
      --accent:#e88a52;
      --accent-soft:#3a2a1c;
      --good:#7fb894;
      --good-soft:#213229;
      --warn:#e08063;
      --line:#3a3128;
      --shadow: 0 2px 10px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1713;
    --card:#252019;
    --ink:#f2e9e0;
    --ink-soft:#b8ab9e;
    --accent:#e88a52;
    --accent-soft:#3a2a1c;
    --good:#7fb894;
    --good-soft:#213229;
    --warn:#e08063;
    --line:#3a3128;
    --shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 48px;
  }
  header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .paw{
    font-size:34px;
    line-height:1;
  }
  h1{
    font-size:22px;
    margin:0;
    font-weight:700;
  }
  .sub{
    margin:2px 0 0;
    color:var(--ink-soft);
    font-size:13px;
  }
  .name-chip{
    margin-left:auto;
    background:var(--accent-soft);
    color:var(--accent);
    border:none;
    border-radius:999px;
    padding:7px 12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .today-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .today-head h2{
    font-size:16px;
    margin:0;
  }
  .today-date{
    color:var(--ink-soft);
    font-size:13px;
  }
  .dose-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .dose-row:first-of-type{ border-top:none; }
  .check{
    flex:0 0 auto;
    width:26px;
    height:26px;
    border-radius:8px;
    border:2px solid var(--accent);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--card);
    font-size:15px;
    transition:background .15s ease;
  }
  .check.checked{
    background:var(--good);
    border-color:var(--good);
  }
  .dose-info{ flex:1; min-width:0; }
  .dose-med{
    font-weight:600;
    font-size:14.5px;
  }
  .dose-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .dose-time{
    flex:0 0 auto;
    font-size:13px;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .empty-today{
    color:var(--ink-soft);
    font-size:14px;
    padding:8px 0;
  }
  .med-card h3{
    font-size:15.5px;
    margin:0 0 2px;
  }
  .med-tag{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    margin-bottom:6px;
  }
  .med-detail{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .med-note{
    margin-top:6px;
    font-size:13px;
    color:var(--warn);
    font-weight:600;
  }
  .progress-wrap{
    margin-top:10px;
  }
  .progress-bar{
    height:8px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--good);
    border-radius:999px;
    transition:width .2s ease;
  }
  .progress-label{
    margin-top:5px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }
  .toggle-history{
    margin-top:10px;
    background:none;
    border:none;
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    padding:0;
    cursor:pointer;
  }
  .history{
    display:none;
    margin-top:10px;
    max-height:260px;
    overflow-y:auto;
    border-top:1px solid var(--line);
    padding-top:8px;
  }
  .history.open{ display:block; }
  .hist-day{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    font-size:13px;
  }
  .hist-date{
    flex:0 0 74px;
    color:var(--ink-soft);
  }
  .hist-slots{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .mini-check{
    width:22px;
    height:22px;
    border-radius:6px;
    border:1.5px solid var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--card);
    cursor:pointer;
  }
  .mini-check.checked{
    background:var(--good);
    border-color:var(--good);
  }
  .mini-check.future{
    opacity:.35;
    cursor:default;
    pointer-events:none;
  }
  .status-pill{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:999px;
    margin-left:6px;
  }
  .status-active{ background:var(--good-soft); color:var(--good); }
  .status-done{ background:var(--line); color:var(--ink-soft); }
  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:12px;
    margin-top:12px;
  }
  .offline-note{
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:12px;
    padding:10px 12px;
    font-size:12.5px;
    margin-bottom:14px;
  }
  .reward-row{
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .reward-row:first-child{ border-top:none; }
  .reward-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .reward-name{
    font-weight:700;
    font-size:14.5px;
  }
  .reward-gifts{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
  }
  .reward-progress-label{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .hero{padding:18px;background:linear-gradient(145deg,var(--card),var(--accent-soft));overflow:hidden}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .hero-title{font-size:22px;line-height:1.2;font-weight:800;margin:0 0 5px}
  .hero-copy{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px}
  .hero-time{font-variant-numeric:tabular-nums}
  .primary-btn{width:100%;border:0;border-radius:12px;background:var(--accent);color:white;padding:12px 14px;font-size:14px;font-weight:750;cursor:pointer}
  .primary-btn:active{transform:scale(.99)}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
  .section-title h2{font-size:16px;margin:0}
  .count-pill{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:999px}
  .completed-toggle{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--ink-soft);padding:12px 0 0;margin-top:4px;text-align:left;font-weight:650;cursor:pointer}
  .completed-list{display:none;margin-top:8px}.completed-list.open{display:block}
  .dose-row.done{opacity:.66}.dose-row.done .dose-med{text-decoration:line-through}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .bottom-nav{position:sticky;bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 30px rgba(50,30,10,.16);padding:5px;border-radius:16px;z-index:10;margin-top:18px}
  .nav-btn{border:0;background:none;color:var(--ink-soft);border-radius:11px;padding:9px 3px;font-size:11.5px;font-weight:700;cursor:pointer}.nav-btn span{display:block;font-size:18px;margin-bottom:2px}.nav-btn.active{background:var(--accent-soft);color:var(--accent)}
  .reward-compact{display:flex;align-items:center;gap:12px}.reward-icon{font-size:25px}.reward-summary{flex:1}.reward-summary strong{display:block;font-size:14px}.reward-summary span{font-size:12px;color:var(--ink-soft)}
  .history-card h3{font-size:15px;margin:0 0 10px}.history-entry{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.history-entry:first-of-type{border-top:0}.history-check{color:var(--good);font-weight:800}.history-main{flex:1}.history-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .notify-card{display:flex;align-items:center;gap:12px}.notify-icon{font-size:27px}.notify-copy{flex:1}.notify-copy strong{display:block;font-size:14px}.notify-copy span{display:block;color:var(--ink-soft);font-size:12px;line-height:1.35;margin-top:2px}.notify-btn{border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:750;padding:9px 11px;cursor:pointer;white-space:nowrap}.notify-btn.enabled{background:var(--good-soft);color:var(--good)}

/* ---------- Utilidades de fecha ---------- */
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function addDays(d, n){
  const r = new Date(d);
  r.setDate(r.getDate()+n);
  return r;
}
function todayStr(){ return fmtDate(new Date()); }
function medEndDate(med, state){
  return addDays(parseDate(state.startDate), med.days-1);
}
function medDateRange(med, state){
  const start = parseDate(state.startDate);
  const end = medEndDate(med, state);
  const out = [];
  let cur = start;
  while (cur <= end){
    out.push(fmtDate(cur));
    cur = addDays(cur,1);
  }
  return out;
}
function doseKey(medId, date, time){ return `${medId}|${date}|${time}`; }

/* ---------- Render ---------- */
let STATE = null;
let openHistory = {};
let completedOpen = false;
let pendingConfirmation = null;

function loadName(){
  try{ return localStorage.getItem("kenai_name") || ""; }catch(e){ return ""; }
}
function saveName(n){
  try{ localStorage.setItem("kenai_name", n); }catch(e){}
}

function renderTodayDate(){
  const el = document.getElementById("todayDate");
  const d = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  el.textContent = d.toLocaleDateString('es-ES', opts);
}

function isChecked(medId, date, time){
  const e = STATE.log[doseKey(medId,date,time)];
  return !!(e && e.checked);
}
function whoChecked(medId, date, time){
  const e = STATE.log[doseKey(medId,date,time)];
  return e && e.checked ? e.by : null;
}

function todayDoses(){
  const today = todayStr(), doses = [];
  STATE.meds.forEach(med=>{
    if (!medDateRange(med, STATE).includes(today)) return;
    med.times.forEach(time=>doses.push({med,date:today,time,checked:isChecked(med.id,today,time),entry:STATE.log[doseKey(med.id,today,time)]}));
  });
  return doses.sort((a,b)=>a.time.localeCompare(b.time));
}

function doseDate(dose){ return new Date(`${dose.date}T${dose.time}:00`); }
function minutesLabel(min){
  const abs = Math.abs(Math.round(min));
  if (abs < 60) return `${abs} min`;
  const h = Math.floor(abs/60), m = abs%60;
  return m ? `${h} h ${m} min` : `${h} h`;
}

function renderStatusHero(){
  const hero = document.getElementById("statusHero");
  const pending = todayDoses().filter(d=>!d.checked);
  if (!pending.length){
    hero.innerHTML = `<div class="eyebrow">Todo listo</div><div class="hero-title">🎉 Kenai está listo por hoy</div><p class="hero-copy">Todas las dosis de hoy fueron dadas.</p>`;
    return;
  }
  const now = new Date();
  const overdue = pending.filter(d=>doseDate(d) < now);
  const target = overdue.length ? overdue[0] : pending[0];
  const sameTime = pending.filter(d=>d.time===target.time);
  const diff = (doseDate(target)-now)/60000;
  let eyebrow, title, cls="";
  if (diff < 0){ eyebrow="Dosis pendiente"; title=`Atrasada ${minutesLabel(diff)}`; cls=" danger-state"; }
  else if (diff <= 30){ eyebrow="En breve"; title=`En ${minutesLabel(diff)}`; }
  else { eyebrow="Próxima dosis"; title=target.time; }
  hero.innerHTML = `<div class="eyebrow${cls}">${eyebrow}</div><div class="hero-title hero-time${cls}">${title}</div><p class="hero-copy">${sameTime.map(d=>`${d.med.name} · ${d.med.dose}`).join("<br>")}</p><button class="primary-btn" id="heroAction">Marcar ${sameTime.length>1?'estas dosis':'esta dosis'} como ${sameTime.length>1?'dadas':'dada'}</button>`;
  document.getElementById("heroAction").addEventListener("click",()=>requestConfirmation(sameTime));
}

function renderToday(){
  const list = document.getElementById("todayList");
  list.innerHTML = "";
  const doses = todayDoses();
  const pending = doses.filter(d=>!d.checked), done = doses.filter(d=>d.checked);
  document.getElementById("pendingCount").textContent = `${pending.length} pendiente${pending.length===1?'':'s'}`;
  const addRow = (dose, parent, doneClass=false)=>{
      const {med,date,time,checked,entry} = dose;
      const row = document.createElement("div");
      row.className = `dose-row${doneClass?' done':''}`;
      row.innerHTML = `
        <button class="check ${checked?'checked':''}" data-med="${med.id}" data-date="${date}" data-time="${time}" aria-label="${checked?'Desmarcar':'Marcar'} ${med.name}">${checked?'✓':''}</button>

          <div class="dose-med">${med.name} <span style="color:var(--ink-soft); font-weight:400;">— ${med.dose}</span></div>
          <div class="dose-meta">${checked ? `Dado por ${entry?.by||'alguien'}${entry?.at?' · '+new Date(entry.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):''}` : (med.note ? '⚠ '+med.note : 'Pendiente')}</div>
        </div>
        <div class="dose-time">${time}</div>
      `;
      parent.appendChild(row);
  };
  pending.forEach(d=>addRow(d,list));
  if (!doses.length){
    list.innerHTML = '<div class="empty-today">No hay dosis programadas para hoy 🎉</div>';
  } else if (!pending.length){
    list.innerHTML = '<div class="empty-today">No queda ninguna dosis pendiente.</div>';
  }
  if (done.length){
    const btn=document.createElement("button"); btn.className="completed-toggle"; btn.textContent=`✓ ${done.length} dosis dada${done.length===1?'':'s'} hoy · ${completedOpen?'Ocultar':'Ver'}`; list.appendChild(btn);
    const wrap=document.createElement("div"); wrap.className=`completed-list${completedOpen?' open':''}`; done.forEach(d=>addRow(d,wrap,true)); list.appendChild(wrap);
    btn.addEventListener("click",()=>{completedOpen=!completedOpen;renderToday();});
  }
  list.querySelectorAll(".check").forEach(el=>{
    el.addEventListener("click", onToggle);
  });
}

/* ---------- Premios ---------- */
const ON_TIME_TOLERANCE_MIN = 60;

function computeRewards(){
  const counts = {};
  Object.keys(STATE.log).forEach(key=>{
    const entry = STATE.log[key];
    if (!entry || !entry.checked || !entry.at || !entry.by) return;
    const parts = key.split("|");
    const date = parts[1], time = parts[2];
    const sched = new Date(`${date}T${time}:00`);
    const at = new Date(entry.at);
    const diffMin = Math.abs(at - sched) / 60000;
    const onTime = diffMin <= ON_TIME_TOLERANCE_MIN;
    if (!counts[entry.by]) counts[entry.by] = { onTime: 0, total: 0 };
    counts[entry.by].total++;
    if (onTime) counts[entry.by].onTime++;
  });
  return counts;
}

function renderRewards(){
  const counts = computeRewards();
  const names = Object.keys(counts).sort((a,b)=> counts[b].onTime - counts[a].onTime);
  const card = document.getElementById("rewardsCard");
  const list = document.getElementById("rewardsList");
  if (!names.length){
    card.style.display = "none";
    return;
  }
  card.style.display = "block";
  list.innerHTML = '<div class="section-title"><h2>Premios</h2><span class="count-pill">Cada 10 dosis</span></div>';
  names.forEach(name=>{
    const c = counts[name];
    const gifts = Math.floor(c.onTime / 10);
    const progress = c.onTime % 10;
    const pct = (progress/10)*100;
    const row = document.createElement("div");
    row.className = "reward-row reward-compact";
    row.innerHTML = `
      <div class="reward-icon">🎁</div><div class="reward-summary"><strong>${name} · ${progress}/10 ${gifts ? `· ${gifts} regalo${gifts===1?'':'s'}` : ''}</strong><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span>Faltan ${10-progress} para el próximo regalo</span></div>
    `;
    list.appendChild(row);
  });
}

function renderGlobalHistory(){
  const wrap=document.getElementById("globalHistory");
  const entries=Object.entries(STATE.log).filter(([,e])=>e&&e.checked).sort((a,b)=>new Date(b[1].at||0)-new Date(a[1].at||0));
  wrap.innerHTML='<div class="card history-card"><div class="section-title"><h2>Historial</h2><span class="count-pill">Últimas dosis</span></div><div id="historyEntries"></div></div>';
  const dest=document.getElementById("historyEntries");
  if(!entries.length){dest.innerHTML='<div class="empty-today">Todavía no hay dosis registradas.</div>';return;}
  entries.slice(0,60).forEach(([key,e])=>{
    const [medId,date,time]=key.split('|'), med=STATE.meds.find(m=>m.id===medId); if(!med)return;
    const row=document.createElement('div');row.className='history-entry';
    row.innerHTML=`<div class="history-check">✓</div><div class="history-main"><strong>${med.name} · ${med.dose}</strong><div class="history-meta">${parseDate(date).toLocaleDateString('es-AR',{day:'numeric',month:'short'})} · dosis ${time} · ${e.by||'Alguien'}${e.at?' a las '+new Date(e.at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`;dest.appendChild(row);
  });
}

function renderMeds(){
  const wrap = document.getElementById("medsList");
  wrap.innerHTML = "";
  const today = todayStr();
  STATE.meds.forEach(med=>{
    const range = medDateRange(med, STATE);
    const end = medEndDate(med, STATE);
    const isDone = parseDate(today) > end;
    const total = range.length * med.times.length;
    let done = 0;
    range.forEach(date=>{
      med.times.forEach(time=>{ if (isChecked(med.id,date,time)) done++; });
    });
    const pct = total ? Math.round((done/total)*100) : 0;

    const card = document.createElement("div");
    card.className = "card med-card";
    const freqLabel = med.times.length > 1 ? `cada ${24/med.times.length}h` : "1 vez al día";
    card.innerHTML = `
      <span class="med-tag">${med.days} días</span>
      <span class="status-pill ${isDone ? 'status-done' : 'status-active'}">${isDone ? 'Finalizado' : 'En curso'}</span>
      <h3>${med.name}</h3>
      <div class="med-detail">${med.dose} · ${freqLabel} · desde ${STATE.startDate} hasta ${fmtDate(end)}</div>
      ${med.note ? `<div class="med-note">⚠ ${med.note}</div>` : ""}
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>${done} de ${total} dosis dadas</span><span>${pct}%</span></div>
      </div>
      <button class="toggle-history" data-med="${med.id}" type="button">${openHistory[med.id] ? 'Ocultar historial' : 'Ver historial completo'}</button>
      <div class="history ${openHistory[med.id] ? 'open' : ''}" id="hist-${med.id}"></div>
    `;
    wrap.appendChild(card);

    const histEl = card.querySelector(`#hist-${med.id}`);
    range.forEach(date=>{
      const isFuture = parseDate(date) > parseDate(today);
      const row = document.createElement("div");
      row.className = "hist-day";
      const dLabel = date === today ? "Hoy" : date.slice(5).split("-").reverse().join("/");
      row.innerHTML = `
        <div class="hist-date">${dLabel}</div>
        <div class="hist-slots">
          ${med.times.map(time=>{
            const checked = isChecked(med.id,date,time);
            return `<div class="mini-check ${checked?'checked':''} ${isFuture?'future':''}" data-med="${med.id}" data-date="${date}" data-time="${time}">${checked?'✓':time.slice(0,2)}</div>`;
          }).join("")}
        </div>
      `;
      histEl.appendChild(row);
    });
    histEl.querySelectorAll(".mini-check:not(.future)").forEach(el=>{
      el.addEventListener("click", onToggle);
    });

    card.querySelector(".toggle-history").addEventListener("click", (e)=>{
      openHistory[med.id] = !openHistory[med.id];
      renderMeds();
    });
  });
}

function renderAll(){
  renderTodayDate();
  renderStatusHero();
  renderToday();
  renderRewards();
  renderMeds();
  renderGlobalHistory();
  const chip = document.getElementById("nameChip");
  chip.textContent = loadName() || "Poner mi nombre";
}

/* ---------- Interacción ---------- */
async function ensureName(){
  let n = loadName();
  if (!n){
    n = prompt("¿Cómo te llamás? (para saber quién dio cada dosis)", "");
    if (n){ n = n.trim(); saveName(n); }
  }
  return n || "Alguien";
}

async function onToggle(e){
  const el = e.currentTarget;
  const med = el.dataset.med, date = el.dataset.date, time = el.dataset.time;
  const key = doseKey(med,date,time);
  const currentlyChecked = isChecked(med,date,time);
  if (currentlyChecked){
    if (confirm("¿Querés desmarcar esta dosis?")){ delete STATE.log[key]; renderAll(); await persist(); }
  } else {
    const dose=todayDoses().find(d=>d.med.id===med&&d.date===date&&d.time===time) || {med:STATE.meds.find(m=>m.id===med),date,time};
    requestConfirmation([dose]);
  }
}

function requestConfirmation(doses){
  pendingConfirmation=doses;
  document.getElementById('confirmText').innerHTML=`¿Confirmás que le diste a Kenai ${doses.length>1?'estas dosis':'esta dosis'}?<br><br><strong>${doses.map(d=>`${d.med.name} · ${d.med.dose}`).join('<br>')}</strong>`;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirmation(){document.getElementById('confirmModal').classList.remove('open');pendingConfirmation=null;}
document.getElementById('cancelConfirm').addEventListener('click',closeConfirmation);
document.getElementById('confirmModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeConfirmation();});
document.getElementById('acceptConfirm').addEventListener('click',async()=>{
  if(!pendingConfirmation)return; const name=await ensureName(); const at=new Date().toISOString();
  pendingConfirmation.forEach(d=>{STATE.log[doseKey(d.med.id,d.date,d.time)]={checked:true,by:name,at};});
  closeConfirmation();renderAll();await persist();
});

document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{

  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab-${btn.dataset.tab}`));
  window.scrollTo({top:0,behavior:'smooth'});
}));

document.getElementById("nameChip").addEventListener("click", async ()=>{
  const n = prompt("¿Cómo te llamás?", loadName()||"");
  if (n !== null && n.trim()){ saveName(n.trim()); renderAll(); }
});

/* ---------- Persistencia con Firebase Firestore ---------- */
let db = null;
let docRef = null;
let firebaseReady = false;
let applyingRemote = false;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
}

async function refreshNotificationUI(){
  const card=document.getElementById('notificationCard');
  const btn=document.getElementById('notificationButton');
  const status=document.getElementById('notificationStatus');
  const pushSupported = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  if(!pushSupported){
    status.textContent='Este dispositivo no admite notificaciones web.'; btn.style.display='none'; return;
  }
  if(!isStandalone() && /iPhone|iPad|iPod/.test(navigator.userAgent)){
    status.textContent='Primero agregá Kenai a la pantalla de inicio.'; btn.textContent='Cómo hacerlo';
  } else if(Notification.permission==='granted'){
    status.textContent='Te avisaremos una hora antes de cada dosis.'; btn.textContent='Activadas'; btn.classList.add('enabled');
  } else if(Notification.permission==='denied'){
    status.textContent='Están bloqueadas. Podés habilitarlas desde Ajustes del iPhone.'; btn.textContent='Bloqueadas';
  }
  card.style.display='flex';
}

async function enableNotifications(){
  const status=document.getElementById('notificationStatus');
  const btn=document.getElementById('notificationButton');
  if(!isStandalone() && /iPhone|iPad|iPod/.test(navigator.userAgent)){
    alert('Abrí esta página desde el ícono Kenai de tu pantalla de inicio para activar las notificaciones.'); return;
  }
  try{
    btn.disabled=true; status.textContent='Activando…';
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){ await refreshNotificationUI(); return; }
    const registration=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_KEY)});
    const response=await fetch('/.netlify/functions/register-push',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(subscription)});
    if(!response.ok) throw new Error('No se pudo guardar la suscripción');
    await refreshNotificationUI();
  }catch(err){
    console.error('Notification setup failed',err);
    status.textContent='No pudimos activar los avisos. Intentá nuevamente.';
  }finally{btn.disabled=false;}
}

document.getElementById('notificationButton').addEventListener('click',enableNotifications);

function firebaseConfigured(){
  return firebaseConfig && Object.values(firebaseConfig).every(v => v && v !== "PEGAR_AQUI");
}

async function persist(){
  if (firebaseReady && docRef){
    try{
      await docRef.set({ log: STATE.log }, { merge: false });
    }catch(err){
      console.error("Firestore write failed", err);
      try{ localStorage.setItem("kenai_state", JSON.stringify(STATE)); }catch(e){}
    }
  } else {
    try{ localStorage.setItem("kenai_state", JSON.stringify(STATE)); }catch(e){}
  }
}

function subscribeRealtime(){
  docRef.onSnapshot(snap=>{
    applyingRemote = true;
    if (snap.exists){
      const data = snap.data();
      STATE.log = data && data.log ? data.log : {};
    } else {
      docRef.set({ log: {} }).catch(()=>{});
      STATE.log = {};
    }
    renderAll();
    applyingRemote = false;
  }, err=>{
    console.error("Firestore listen failed", err);
  });
}

async function init(){
  STATE = JSON.parse(JSON.stringify(INITIAL_STATE));
  renderAll();

  if (!firebaseConfigured()){
    document.getElementById("offlineNote").style.display = "block";
    try{
      const local = localStorage.getItem("kenai_state");
      if (local){ STATE = JSON.parse(local); renderAll(); }
    }catch(e){}
    return;
  }

  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection("kenai").doc("state");
    firebaseReady = true;
    document.getElementById("offlineNote").style.display = "none";
    refreshNotificationUI();
    subscribeRealtime();
  }catch(err){
    console.error("Firebase init failed", err);
    firebaseReady = false;
    document.getElementById("offlineNote").style.display = "block";
    try{
      const local = localStorage.getItem("kenai_state");
      if (local){ STATE = JSON.parse(local); renderAll(); }
    }catch(e){}
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
